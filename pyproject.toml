[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-pipeline-dashboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["streamlit", "pydantic>=2", "PyYAML", "cryptography", "fastapi", "uvicorn"]

[tool.setuptools]
packages = ["core", "core.steps", "core.llm", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
